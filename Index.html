<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Miraculos do Gato Preto</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    body {
      background: #000;
      color: #EEE;
      font-family: 'Lobster', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .phone {
      width: 320px; height: 600px;
      background: #111;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    h3 mark {
      background: #333;
      color: #fff;
      padding: 5px 10px;
      border-radius: 8px;
    }
    h3 { text-align: center; font-size: 24px; }
    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    button {
      width: 80%; padding: 10px;
      background: #222; border: none;
      border-radius: 20px; font-size: 18px;
      color: #fff; cursor: pointer;
      transition: background 0.3s;
      font-family: 'Lobster', cursive;
    }
    button:hover { background: #444; }
    .smoke {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      animation: fadeSmoke 1s forwards;
    }
    @keyframes fadeSmoke { from { opacity: 1; } to { opacity: 0; } }
  </style>
</head>
<body>
  <div class="phone">
    <h3><mark>Hell cat</mark></h3>
    <div class="buttons">
      <button onclick="enviarMensagem()">💬 Enviar mensagem</button>
      <button onclick="lerConversa()">📖 Ler conversa</button>
      <button onclick="destruirEfeitos()">💥 Cataclismo</button>
    </div>
  </div>

  <script>
    alert('PLAGG MOSTRAR AS GARRAS');

    const PARTICIPANTES = ['Litlegot','Psique','Abrax','Beast','Yellowfer','Lindemberg'];
    const ME = 'Hell Cat';
    const channel = new BroadcastChannel('global_channel');

    // utils de mensagens
    function enviarMensagem(){
      let dest = prompt(`Enviar para?\n${PARTICIPANTES.join(', ')}`);
      if(!PARTICIPANTES.includes(dest)) return alert('Destino inválido.');
      let txt = prompt(`Mensagem de ${ME} para ${dest}:`);
      if(!txt) return;
      channel.postMessage({ type: 'msg', data:{ from:ME, to:dest, text:txt.trim() } });
      alert('Mensagem enviada!');
    }
    function lerConversa(){
      alert('Use o chat do destinatário para ler.');
    }

    // destrói todos os efeitos ativos
    function destruirEfeitos(){
      // envia um evento de reset geral
      channel.postMessage({ type:'resetAll' });
      // efeito visual
      const s = document.createElement('div');
      s.className = 'smoke';
      document.body.appendChild(s);
      setTimeout(()=> s.remove(), 1000);
      alert('💨 Todos os efeitos foram destruídos!');
    }

    // ouve resets
    channel.onmessage = ev => {
      const { type, data } = ev.data;
      if(type === 'resetAll'){
        // limpa tudo localmente
        localStorage.clear();
        alert('🔥 Seus efeitos e histórico foram destruídos pelo Gato Preto!');
      }
      if(type === 'msg' && data.to === ME){
        alert(`📨 De ${data.from}: ${data.text}`);
      }
    };
  </script>
</body>
</html>
